<p-card>
  <div class="flex flex-col gap-4">
    <div class="flex gap-4 items-center">
      <form class="flex gap-4 items-center" (ngSubmit)="$event.preventDefault(); loadReport();">
        <div class="flex gap-2 items-center">
          <label for="search">Search</label>
          <input
            pInputText
            id="search"
            type="text"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            name="search"
          />
        </div>

        <p-button type="submit" label="Filter"></p-button>
        <p-button type="button" (click)="reset()" label="Reset"></p-button>
        <p-button type="button" (click)="exportReport('pdf')" label="Export Pdf"></p-button>
        <p-button type="button" (click)="exportReport('csv')" label="Export CSV"></p-button>
        <p-button type="button" (click)="exportReport('xlsx')" label="Export Excel"></p-button>
      </form>
    </div>

    <p-table
      [value]="items()"
      [loading]="isLoading()"
      [tableStyle]="{'min-width': '50rem'}"
      styleClass="p-datatable-sm"
      [showLoader]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          
          <th>Id </th>
          <th>Name</th>
          <th>Total Distance</th>
          <th>Loads  Dilvered</th>
          <th>Total Earnings</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-driver>
        <tr>
          <td>{{driver.driverId}}</td>
          <td>{{driver.driverName}}</td>
          <td>{{driver.distanceDriven}}</td>
          <td>{{driver.loadsDelivered}}</td>
          <td>${{driver.grossEarnings}}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8" class="text-center">No drivers found</td>
        </tr>
      </ng-template>
    </p-table>

    <div class="flex justify-between">
      <p>Total Drivers: <strong>{{totalCount()}}</strong></p>
    </div>
  </div>
</p-card>
